# ============================================================
#  HTTPS 阶段 nginx 站点配置（setup-ssl.sh 拿到证书后启用）
#
#  关键功能：
#    1) 80 端口任何路径都强制 301 跳转到 https，仅放行 ACME 验证
#    2) 443 端口 + HTTP/2 + TLS1.2/1.3 + HSTS + OCSP Stapling
#    3) 与 nginx-http.conf 完全一致的路由分发
#
#  路由规划（同 nginx-http.conf）：
#    /                       → Next.js 前端门户       （127.0.0.1:__PORTAL_PORT__）
#    /api/backend/...        → Next.js 内置代理
#    /api/...                → Django REST API         （127.0.0.1:__BACKEND_PORT__）
#    /admin/, /django-admin/ → Django Admin
#    /static/, /media/       → Django collectstatic / 用户上传
#    /console/               → Vue 管理后台 ai-frontend（127.0.0.1:__CONSOLE_PORT__，serve SPA）
#
#  占位符会在 setup-ssl.sh 中被 sed 替换：
#    __DOMAIN__           主域名（多个用空格分隔），如 8ms.ai www.8ms.ai
#    __PRIMARY_DOMAIN__   主域名（用于 ssl_certificate 路径），如 8ms.ai
#    __PORTAL_PORT__      Next.js 门户监听端口
#    __BACKEND_PORT__     Django Gunicorn 监听端口
#    __CONSOLE_PORT__     Vue 管理后台 serve 监听端口（默认 5173）
#    __STATIC_ROOT__      Django collectstatic 目录
#    __MEDIA_ROOT__       Django media 上传目录
# ============================================================

upstream ms8_portal_upstream {
    server 127.0.0.1:__PORTAL_PORT__;
    keepalive 32;
}
upstream ms8_backend_upstream {
    server 127.0.0.1:__BACKEND_PORT__;
    keepalive 32;
}
upstream ms8_console_upstream {
    server 127.0.0.1:__CONSOLE_PORT__;
    keepalive 16;
}

# ─── HTTP → HTTPS 强制跳转（保留 ACME 验证目录） ───
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 给 certbot 续期保留 webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余所有路径全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS 主站 ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # ─── SSL 证书 ───
    ssl_certificate     /etc/letsencrypt/live/__PRIMARY_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PRIMARY_DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__PRIMARY_DOMAIN__/chain.pem;

    # ─── 现代 SSL 参数（Mozilla intermediate, OpenSSL 3.x） ───
    ssl_session_timeout 1d;
    ssl_session_cache shared:MS8AI_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ─── OCSP Stapling ───
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── 安全响应头 ───
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;
    server_tokens off;

    # ─── ACME HTTP-01 验证（保留以便 webroot 续期） ───
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ─── Django 静态文件 ───
    location ^~ /static/ {
        alias __STATIC_ROOT__/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ─── 用户上传 / Media ───
    location ^~ /media/ {
        alias __MEDIA_ROOT__/;
        expires 7d;
        access_log off;
    }

    # ─── Vue 管理后台 (ai-frontend) ─── 反向代理到 127.0.0.1:__CONSOLE_PORT__ ───
    #
    # ai-frontend 作为独立 systemd 服务运行（aiprogram-frontend.service），
    # 通过 `serve -s dist -l __CONSOLE_PORT__` 提供 SPA。Vite 构建时带了
    # --base=/console/，所以 index.html 引用资源全是 /console/assets/...
    #
    # proxy_pass 末尾带斜杠 `/` ⇒ nginx 把 /console/ 前缀剥掉再转发：
    #   /console/                 → /                 → dist/index.html
    #   /console/assets/foo.js    → /assets/foo.js    → dist/assets/foo.js
    #   /console/admin/dashboard  → /admin/dashboard  → SPA fallback
    location = /console {
        return 301 https://$host/console/;
    }

    location /console/ {
        proxy_pass http://ms8_console_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix /console;
        proxy_set_header Connection        "";

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;

        # 按文件类型应用 cache-control（map 见 nginx-upgrade-map.conf）
        proxy_hide_header Cache-Control;
        add_header Cache-Control $console_cache_control always;
    }

    # ─── OpenAI 兼容 API（/v1/...）→ Django ───
    # 外部工具（Cline / Continue / Cherry Studio / OpenAI SDK 等）常用
    # base_url = https://domain/v1，请求 /v1/chat/completions 等路径。
    # 必须在 location / 之前，否则会落到 Next.js 返回 HTML。
    location ^~ /v1/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Next.js 自带 /api/backend/* 代理（必须在 /api/ 之前） ───
    location ^~ /api/backend/ {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Django REST API ───
    location ^~ /api/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Django Admin（含 CSRF / 登录等） ───
    location ^~ /admin/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;
    }
    location ^~ /django-admin/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
    }

    # ─── Next.js 自带静态资源缓存 ───
    location ^~ /_next/static/ {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host        $host;
        proxy_set_header Connection  "";
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ─── Next.js 主入口（SSR / 路由 / 页面） ───
    location / {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;
    }

    # ─── gzip 压缩 ───
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_vary on;
}
