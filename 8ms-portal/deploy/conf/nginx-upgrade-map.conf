# ============================================================
#  顶层 nginx http {} 公共片段
#  此文件由部署脚本写入 /etc/nginx/conf.d/ms8-upgrade-map.conf
# ============================================================

# WebSocket / SSE 透传
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Vue 管理后台 (/console/) 的 Cache-Control
#   带 hash 的静态资源 → 30 天 immutable
#   其他（含 index.html、HTML 路由）→ no-cache 防止 SPA 升级后用户拿到旧版
map $request_uri $console_cache_control {
    ~*^/console/.+\.(?:js|mjs|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp|map)(?:\?.*)?$  "public, max-age=2592000, immutable";
    default                                                                              "no-cache";
}
