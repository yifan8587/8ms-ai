# ============================================================
#  HTTP-only 阶段 nginx 站点配置（首次部署 / 申请证书前使用）
#  setup-ssl.sh 申请到证书后会用 nginx-https.conf 覆盖此文件
#
#  路由规划：三个独立后端服务，通过 nginx 在同一个域名下统一对外。
#    /                       → Next.js 前端门户       （127.0.0.1:__PORTAL_PORT__）
#    /_next/, /favicon.ico   → Next.js 静态资源
#    /api/backend/...        → Next.js 内置代理 (不要直连 Django)
#    /api/...                → Django REST API         （127.0.0.1:__BACKEND_PORT__）
#    /admin/, /django-admin/ → Django Admin
#    /static/, /media/       → Django collectstatic / 用户上传
#    /console/               → Vue 管理后台 ai-frontend（127.0.0.1:__CONSOLE_PORT__，由 serve 提供 SPA）
#    /.well-known/acme-challenge/ → Certbot 验证
#
#  占位符会在部署脚本中被 sed 替换：
#    __DOMAIN__         主域名（多个用空格分隔），例如 8ms.ai www.8ms.ai
#    __PORTAL_PORT__    Next.js 门户监听端口（默认 3013）
#    __BACKEND_PORT__   Django Gunicorn 监听端口（默认 8090）
#    __CONSOLE_PORT__   Vue 管理后台 serve 监听端口（默认 5173）
#    __STATIC_ROOT__    Django collectstatic 目录
#    __MEDIA_ROOT__     Django media 上传目录
# ============================================================

# ── upstream（便于复用 + keepalive） ──
upstream ms8_portal_upstream {
    server 127.0.0.1:__PORTAL_PORT__;
    keepalive 32;
}
upstream ms8_backend_upstream {
    server 127.0.0.1:__BACKEND_PORT__;
    keepalive 32;
}
upstream ms8_console_upstream {
    server 127.0.0.1:__CONSOLE_PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 50m;
    server_tokens off;

    # ─── ACME HTTP-01 验证目录（certbot 会写入临时文件） ───
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ─── Django 静态文件（admin CSS/JS 等） ───
    location ^~ /static/ {
        alias __STATIC_ROOT__/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ─── 用户上传 / Media ───
    location ^~ /media/ {
        alias __MEDIA_ROOT__/;
        expires 7d;
        access_log off;
    }

    # ─── Vue 管理后台 (ai-frontend) ─── 反向代理到 127.0.0.1:__CONSOLE_PORT__ ───
    #
    # ai-frontend 作为独立 systemd 服务运行（aiprogram-frontend.service），
    # 通过 `serve -s dist -l __CONSOLE_PORT__` 提供静态 SPA。Vite 构建时
    # 带了 --base=/console/，所以 index.html 引用资源全是 /console/assets/...
    #
    # 关键：proxy_pass 末尾带斜杠 `/`，nginx 会把 /console/ 前缀剥掉再转发。
    #   /console/                 → /                 → dist/index.html
    #   /console/assets/foo.js    → /assets/foo.js    → dist/assets/foo.js
    #   /console/admin/dashboard  → /admin/dashboard  → SPA fallback (serve -s)
    #
    # 缓存策略：$console_cache_control 来自 nginx-upgrade-map.conf 中的 map，
    # 命中带 hash 的静态资源时设为 immutable 长缓存，其他设为 no-cache 防止
    # SPA 升级后客户端拿到旧 index.html。
    location = /console {
        return 301 $scheme://$host/console/;
    }

    location /console/ {
        proxy_pass http://ms8_console_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix /console;
        proxy_set_header Connection        "";

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;

        # serve 自带的 cache-control 比较保守，这里按文件扩展名覆写
        proxy_hide_header Cache-Control;
        add_header Cache-Control $console_cache_control always;
    }

    # ─── OpenAI 兼容 API（/v1/...）→ Django ───
    # 外部工具（Cline / Continue / Cherry Studio / OpenAI SDK 等）常用
    # base_url = https://domain/v1，请求 /v1/chat/completions 等路径。
    location ^~ /v1/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Next.js 自带 /api/backend/* 代理（必须在 /api/ 之前匹配） ───
    location ^~ /api/backend/ {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Django REST API ───
    location ^~ /api/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_request_buffering            off;
        proxy_read_timeout                 600s;
        proxy_send_timeout                 600s;
    }

    # ─── Django Admin（含 CSRF / 登录等） ───
    location ^~ /admin/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;
    }
    location ^~ /django-admin/ {
        proxy_pass http://ms8_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
    }

    # ─── Next.js 自带静态资源（带 hash，长缓存） ───
    location ^~ /_next/static/ {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host        $host;
        proxy_set_header Connection  "";
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ─── Next.js 主入口（SSR / 路由 / 页面） ───
    location / {
        proxy_pass http://ms8_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect                     off;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;
    }

    # ─── gzip 压缩 ───
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_vary on;
}
